<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History for {{ site.url }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 20px; background: #121212; color: #e0e0e0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #fff; word-break: break-all; margin-bottom: 10px; }
        
        /* Timeframe Filter Buttons */
        .filters { display: flex; gap: 8px; margin: 20px 0; }
        .tf-btn { padding: 6px 14px; background: #2a2a2a; color: #aaa; border: 1px solid #444; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .tf-btn.active { background: #2196F3; color: white; border-color: #2196F3; }
        .tf-btn:hover { background: #333; color: white; }

        ul { list-style: none; padding: 0; }
        li { padding: 10px; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; font-family: monospace; font-size: 14px; background: #252525; }
        .badge-up { color: #81c784; }
        .badge-warn { color: #ffb74d; }
        .badge-down { color: #e57373; }
        a.back-link { display: inline-block; margin-top: 20px; color: #2196F3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>History Log: {{ site.url }}</h2>
        <p style="color: #888; font-size: 13px;">Select a timeframe to review past performance:</p>
        
        <!-- Filter Buttons -->
        <div class="filters">
            <a href="/history/{{ site.id }}?tf=1h" class="tf-btn {% if current_tf == '1h' %}active{% endif %}">Past 1 Hour</a>
            <a href="/history/{{ site.id }}?tf=1d" class="tf-btn {% if current_tf == '1d' %}active{% endif %}">Past 1 Day</a>
            <a href="/history/{{ site.id }}?tf=1w" class="tf-btn {% if current_tf == '1w' %}active{% endif %}">Past 1 Week</a>
            <a href="/history/{{ site.id }}?tf=1m" class="tf-btn {% if current_tf == '1m' %}active{% endif %}">Past 1 Month</a>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        
        <ul>
            {% for h in history %}
            <li>
                <span>{{ h.timestamp }}</span>
                <span class="{{ h.status_class }}"><strong>{{ h.status_msg }}</strong></span>
            </li>
            {% else %}
            <li style="color: #888; justify-content: center;">No history logs recorded for this timeframe.</li>
            {% endfor %}
        </ul>

        <a href="/" class="back-link">&larr; Back to Dashboard</a>
    </div>
</body>
</html>
